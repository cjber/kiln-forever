name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: cjber/forever-core/.github/actions/toolchain@43d871fc452bfdb2914ec479f16e1dcaf9d1f00c # main
        with:
          manifest: addon/KilnForever/tools/toolchain.json
          tools: lua
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out Forever Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - name: Test the bridge
        run: cd bridge && npm test

  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out Forever Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@43d871fc452bfdb2914ec479f16e1dcaf9d1f00c # main
        with:
          manifest: addon/KilnForever/tools/toolchain.json
          tools: lua
      - name: Smoke test with Lua 5.1
        run: lua5.1 tools/smoke.lua addon/KilnForever tools/fixtures/snapshot.lua
      - name: Smoke test with LuaJIT
        run: luajit tools/smoke.lua addon/KilnForever tools/fixtures/snapshot.lua
      - name: Run the addon's specs
        working-directory: addon/KilnForever
        run: |
          for spec in tests/*_spec.lua; do
            luajit "$spec" || exit 1
          done

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out Forever Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@43d871fc452bfdb2914ec479f16e1dcaf9d1f00c # main
        with:
          manifest: addon/KilnForever/tools/toolchain.json
          tools: lua
      - name: Lint the addon and tools
        run: luacheck addon tools
      - name: Check the asset blacklist
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "forever-core/.agents/skills/wow-forever-addon/tooling")
          from forever_tools import assets
          root = Path("addon/KilnForever")
          files = [p for p in root.rglob("*") if p.suffix in (".lua", ".xml") and not ({"tests", "tools", "types"} & set(p.relative_to(root).parts))]
          sys.exit(assets.run(files))
          PY
      - name: Lint art
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "forever-core/.agents/skills/wow-forever-addon/tooling")
          from forever_tools import art
          root = Path("addon/KilnForever")
          files = [p for p in root.rglob("*") if p.suffix in (".lua", ".xml") and not ({"tests", "tools", "types"} & set(p.relative_to(root).parts))]
          sys.exit(art.run(root, files, frozenset({"UI/Art.lua"})))
          PY

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --project addon/KilnForever/tools --frozen --group dev actionlint
      - run: uv run --project addon/KilnForever/tools --frozen --group dev zizmor --offline .github

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@43d871fc452bfdb2914ec479f16e1dcaf9d1f00c # main
        with:
          manifest: addon/KilnForever/tools/toolchain.json
          tools: gitleaks
      - name: Gitleaks over the full history
        run: gitleaks git --redact --no-banner .
